[workspace]
resolver = "2"
members = ["crates/inkkeep-core", "crates/inkkeep-win", "crates/inkkeep-cli", "crates/inkkeep-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
unicode-normalization = "0.1"
url = "2"
